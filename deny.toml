[graph]
targets = ["x86_64-unknown-linux-gnu", "wasm32-wasip1"]

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; transitive via zellij-tile -> zellij-utils -> log4rs, no upgrade available" },
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained; transitive via zellij-tile -> zellij-utils, no upgrade available" },
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
skip-tree = [
    { crate = "zellij-tile", reason = "duplicates come from zellij-utils internals and follow the pinned Zellij version" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
