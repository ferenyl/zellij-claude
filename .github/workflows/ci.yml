name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy (wasm)
        run: cargo clippy --target wasm32-wasip1 -p claude-sessions-plugin --locked -- -D warnings

      - name: Build wasm
        run: cargo build --release --locked --target wasm32-wasip1 -p claude-sessions-plugin

      - name: Hook test
        run: sh tests/hook/test_hook.sh

      - name: Shellcheck
        run: |
          shopt -s nullglob globstar
          scripts=(scripts/*.sh tests/**/*.sh)
          if [ ${#scripts[@]} -gt 0 ]; then shellcheck "${scripts[@]}"; fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
