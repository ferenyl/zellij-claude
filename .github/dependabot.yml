version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      rust:
        patterns:
          - "*"
    # zellij-tile must match the supported Zellij version. In 0.x, minor bumps are
    # breaking and need a code + compatibility review, so only patch updates are automatic.
    ignore:
      - dependency-name: "zellij-tile"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
