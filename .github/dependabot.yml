version: 2

# One pull request per ecosystem every Wednesday 05:00 Swedish time, containing all of its updates.
# Review is requested from the code owner (see .github/CODEOWNERS).
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "05:00"
      timezone: "Europe/Stockholm"
    groups:
      rust:
        patterns: ["*"]
    assignees: ["ferenyl"]
    commit-message:
      prefix: "deps"
    # zellij-tile must match the supported Zellij version. In 0.x, minor bumps are
    # breaking and need a code + compatibility review, so only patch updates are automatic.
    ignore:
      - dependency-name: "zellij-tile"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Zellij config and layouts are KDL v1; kdl 5+ parses KDL v2. The examples test
      # must use the same KDL version as Zellij, so stay on kdl 4.x.
      - dependency-name: "kdl"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "05:00"
      timezone: "Europe/Stockholm"
    groups:
      github-actions:
        patterns: ["*"]
    assignees: ["ferenyl"]
    commit-message:
      prefix: "ci"
